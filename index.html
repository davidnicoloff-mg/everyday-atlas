<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9eee7"><title>The Everyday Atlas · Nordic Sanctuary</title><style>
:root{--bg:#f4f3ed;--panel:#fffefa;--ink:#283d35;--muted:#6c7a70;--sage:#dfe8db;--line:#dbe2d8;--accent:#486a56;--gold:#b68d5d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8aa991;outline-offset:2px}.shell{max-width:1180px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{padding:36px 18px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}.brand{font-family:Georgia,serif;font-size:24px;line-height:1.1;letter-spacing:-.7px;margin:10px 12px 7px}.subtitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 12px 36px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--ink);text-align:left;border-radius:12px;padding:12px 14px}.nav button.active,.nav button:hover{background:var(--sage)}.sidefoot{position:absolute;bottom:24px;left:30px;right:24px;color:var(--muted);font-size:12px}.main{padding:42px clamp(18px,5vw,68px) 80px;min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:700}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,56px);font-weight:400;line-height:1.13;margin:10px 0}.hero p{color:var(--muted);max-width:590px}.hero{padding-bottom:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:24px;box-shadow:0 4px 20px #263f2b08}.soft{background:#e9eee7}.stack{display:grid;gap:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card h2{font:normal 27px Georgia,serif;margin:0 0 8px}.card h3{font:normal 21px Georgia,serif;margin:0 0 6px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;border:1px solid #bacdbd;border-radius:99px;padding:5px 10px;color:var(--accent);font-size:12px}.btn{border:0;border-radius:11px;background:var(--accent);color:white;padding:11px 16px;font-weight:600}.btn.secondary{background:var(--sage);color:var(--ink)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{display:block;width:100%;border:1px solid #cad6ca;background:#fff;border-radius:11px;padding:12px;color:var(--ink);margin:9px 0 13px}.field:focus{border-color:var(--accent)}textarea.field{resize:vertical;min-height:100px}.progress{display:flex;gap:6px;margin:20px 0}.progress span{height:5px;border-radius:9px;background:#d8e1d7;flex:1}.progress span.on{background:var(--accent)}.ritual-stage{padding:28px;background:#e9eee7;border-radius:16px;text-align:center}.ritual-stage .symbol{font-size:30px}.ritual-stage h2{font-size:32px;margin:10px}.ritual-stage p{max-width:490px;margin:10px auto}.entry{border-bottom:1px solid var(--line);padding:14px 0}.entry:last-child{border:0}.entry p{white-space:pre-wrap;margin:6px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-title{font:normal 25px Georgia,serif;margin:22px 0 14px}.tabbar{display:none}.notice{font-size:12px;color:var(--muted);padding:12px 0}.hidden{display:none!important}.tag{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}.check{display:flex;gap:10px;align-items:center;padding:10px 0}.check input{accent-color:var(--accent)}.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.empty{color:var(--muted);font-style:italic}.quick{padding:20px;background:#e5e9de;border-radius:16px}.danger{color:#8d4940}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.date{color:var(--muted);font-size:13px}.footer{margin-top:30px;font-size:12px;color:var(--muted)}@media(max-width:760px){.shell{display:block}.sidebar{display:none}.main{padding:28px 18px 110px}.grid{grid-template-columns:1fr}.card{padding:20px}.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:3px;padding:9px 5px max(10px,env(safe-area-inset-bottom));background:#fffefaee;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.tabbar button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 4px;flex:1}.tabbar button.active{color:var(--accent);font-weight:700}.tabbar span{display:block;font-size:19px}.hero h1{font-size:38px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">The Everyday<br>Atlas <span style="color:var(--gold)">✳</span></div><p class="subtitle">Nordic sanctuary</p><nav class="nav" id="nav"></nav><div class="sidefoot">Begin with wonder.<br>Move toward intention.</div></aside><main class="main" id="main"></main></div><nav class="tabbar" id="tabbar"></nav><script>
const KEY='everyday-atlas-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state={gratitude:[],ideas:[],projects:[],tasks:[],ritual:{},...state};let page='home',step=0,ideaFilter='All';const pages=[['home','⌂','Today'],['ritual','☼','Ritual'],['atlas','✎','My Atlas'],['life','◷','Everyday'],['settings','⚙','Settings']];const stages=[['☼','Arrive','Breathe and become present.','Open The Way for your meditation, or sit quietly for a few moments. Nothing to accomplish.'],['♡','Appreciate','A moment of gratitude.','What is one ordinary thing that feels extraordinary when you notice it?'],['✧','Discover','A word worth keeping.','Find a word that sparks your curiosity. What might it mean in your life today?'],['✎','Create','Follow the unexpected.','Write about a place that remembers you.'],['⌁','Carry Forward','Choose an intention.','What quality would you like to bring into today?']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});const stamp=()=>new Date().toISOString();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Could not save on this device. Check browser storage settings.')}};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);function nav(){document.getElementById('nav').innerHTML=pages.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${ico} &nbsp; ${label}</button>`).join('');document.getElementById('tabbar').innerHTML=pages.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}</button>`).join('')}function go(p){page=p;nav();render();scrollTo(0,0)}function wrap(title,lead,content){return `<header class="hero"><div class="topbar"><span class="eyebrow">The Everyday Atlas · v0.1</span><span class="date">${today()}</span></div><h1>${title}</h1><p>${lead}</p></header>${content}<p class="footer">Private prototype · Entries saved only in this browser on this device · No live integrations yet</p>`}function render(){nav();let h='';if(page==='home')h=home();if(page==='ritual')h=ritual();if(page==='atlas')h=atlas();if(page==='life')h=life();if(page==='settings')h=settings();document.getElementById('main').innerHTML=h}function home(){return wrap('A little room to breathe.','Begin with yourself. The world can wait a moment.',`<div class="stack"><section class="card soft"><div class="row"><span class="pill">☼ &nbsp; Morning sanctuary</span><span class="small muted">5 gentle stages</span></div><h2 style="margin-top:18px">Begin with wonder.</h2><p class="muted">Meditation, gratitude, a new word, a creative spark, and an intention.</p><button class="btn" onclick="go('ritual')">Enter morning ritual →</button></section><div class="grid"><section class="card"><div class="tag">Your inner life</div><h3>Capture a thought</h3><p class="muted">An idea doesn't need a destination yet.</p><textarea class="field" id="quickIdea" placeholder="Something worth remembering…"></textarea><button class="btn secondary" onclick="addIdea('quickIdea','Inbox')">Save to Atlas Inbox</button></section><section class="card"><div class="tag">Your compass</div><h3>Today's priorities</h3><p class="muted">A short list, without the noise.</p>${taskList(3)}<button class="btn ghost" onclick="go('life')">Manage priorities →</button></section></div><div class="grid"><section class="card"><div class="tag">The curious mind</div><h3>World & wonder</h3><p class="muted">A future home for a balanced news digest, cultural stories, and unusual discoveries.</p><button class="btn ghost" onclick="go('life')">View source links →</button></section><section class="card"><div class="tag">The daily table</div><h3>What's for dinner?</h3><p class="muted">Save your favorite Substack recipes and plan easy weeknight meals.</p><button class="btn ghost" onclick="go('life')">Explore dinner ideas →</button></section></div></div>`)}function ritual(){const s=stages[step];return wrap('Your morning ritual.','There is no streak to maintain and nothing to catch up on.',`<section class="card"><div class="row"><span class="eyebrow">Stage ${step+1} of 5</span><span class="small muted">Take as long as you like</span></div><div class="progress">${stages.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><div class="ritual-stage"><div class="symbol">${s[0]}</div><h2>${s[1]}</h2><div class="muted">${s[2]}</div><p>${s[3]}</p>${step===0?'<a class="link" href="https://www.thewayapp.com/" target="_blank" rel="noopener">Open The Way website ↗</a>':''}</div>${step>0?`<label for="ritualText" class="small muted" style="display:block;margin-top:18px">Your reflection (optional)</label><textarea class="field" id="ritualText" placeholder="Write without judgment…" oninput="rememberRitual(this.value)">${esc(state.ritual[step]||'')}</textarea>`:''}<div class="actions row"><button class="btn secondary" onclick="changeStep(-1)" ${step===0?'disabled':''}>← Back</button>${step<4?'<button class="btn" onclick="changeStep(1)">Continue →</button>':'<button class="btn" onclick="finishRitual()">Complete ritual ✳</button>'}</div><p class="notice">You can leave this ritual at any time. Reflections remain in your local draft until you complete it.</p></section>`)}function rememberRitual(v){state.ritual[step]=v;save()}function changeStep(n){step=Math.max(0,Math.min(4,step+n));render()}function finishRitual(){let notes=Object.entries(state.ritual).filter(([k,v])=>v.trim());for(const [k,v] of notes){if(k==='1')state.gratitude.unshift({id:uid(),text:v,date:stamp()});else state.ideas.unshift({id:uid(),text:v,type:k==='4'?'Intention':k==='3'?'Creative':k==='2'?'Word':'Inbox',date:stamp()})}state.ritual={};save();step=0;go('home');alert('Your ritual is complete. Reflections were saved to My Atlas on this device.')}function addIdea(id,type){const el=document.getElementById(id),v=el?.value.trim();if(!v)return;state.ideas.unshift({id:uid(),text:v,type,date:stamp()});save();render()}function addGratitude(){const v=document.getElementById('gratitudeInput').value.trim();if(!v)return;state.gratitude.unshift({id:uid(),text:v,date:stamp()});save();render()}function addProject(){const v=document.getElementById('projectInput').value.trim();if(!v)return;state.projects.unshift({id:uid(),text:v,date:stamp()});save();render()}function remove(kind,id){if(!confirm('Delete this entry?'))return;state[kind]=state[kind].filter(x=>x.id!==id);save();render()}function entries(kind){return state[kind].length?state[kind].map(x=>`<div class="entry"><div class="row"><span class="tag">${esc(x.type||new Date(x.date).toLocaleDateString())}</span><button class="btn ghost small" onclick="remove('${kind}','${x.id}')" aria-label="Delete entry">Delete</button></div><p>${esc(x.text)}</p></div>`).join(''):'<p class="empty">A blank page is a beginning.</p>'}function atlas(){return wrap('My Atlas.','A home for gratitude, sparks, and the ideas you want to carry forward.',`<div class="stack"><div class="grid"><section class="card"><div class="tag">Appreciate</div><h2>Gratitude journal</h2><textarea class="field" id="gratitudeInput" placeholder="Today I am grateful for…"></textarea><button class="btn" onclick="addGratitude()">Save gratitude</button><div style="margin-top:16px">${entries('gratitude')}</div></section><section class="card"><div class="tag">Collect</div><h2>Inspiration inbox</h2><select class="field" id="ideaType"><option>Inbox</option><option>Creative</option><option>Quote</option><option>Word</option><option>Intention</option></select><textarea class="field" id="ideaInput" placeholder="A phrase, observation, or possibility…"></textarea><button class="btn" onclick="addIdea('ideaInput',document.getElementById('ideaType').value)">Save inspiration</button><div style="margin-top:16px">${entries('ideas')}</div></section></div><section class="card"><div class="tag">Make</div><h2>Creative projects</h2><p class="muted">A lightweight index of projects. Keep drafting in Ulysses.</p><div class="actions"><input class="field" id="projectInput" style="flex:1;min-width:180px;margin:0" placeholder="Project title or next idea"><button class="btn" onclick="addProject()">Add project</button></div><div style="margin-top:14px">${entries('projects')}</div><a class="link small" href="https://ulysses.app/" target="_blank" rel="noopener">Visit Ulysses ↗</a></section></div>`)}function addTask(){const v=document.getElementById('taskInput').value.trim();if(!v)return;state.tasks.unshift({id:uid(),text:v,done:false,date:stamp()});save();render()}function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}function taskList(limit){let a=state.tasks.slice(0,limit||999);return a.length?a.map(t=>`<div class="check"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" aria-label="Mark task complete"><span style="flex:1;${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.text)}</span><button class="btn ghost small" onclick="remove('tasks','${t.id}')">×</button></div>`).join(''):'<p class="empty">Nothing pressing here yet.</p>'}function life(){return wrap('The everyday world.','A gentle transition from your inner life to everything that needs your care.',`<div class="stack"><section class="card"><div class="tag">Family compass</div><h2>Priorities & family plans</h2><div class="actions"><input class="field" id="taskInput" style="flex:1;min-width:180px;margin:0" placeholder="Add an appointment reminder or task"><button class="btn" onclick="addTask()">Add</button></div>${taskList()}<p class="notice">Google and Apple calendars, school messages, Band, SportsYou, and bus updates are not connected yet.</p></section><div class="grid"><section class="card"><div class="tag">Curious mind</div><h2>Reading room</h2><p class="muted">Visit your publications while we develop a concise, attributed daily digest.</p><div class="stack"><a class="link" href="https://www.nytimes.com/" target="_blank" rel="noopener">The New York Times ↗</a><a class="link" href="https://www.theatlantic.com/" target="_blank" rel="noopener">The Atlantic ↗</a><a class="link" href="https://www.aljazeera.com/" target="_blank" rel="noopener">Al Jazeera ↗</a></div></section><section class="card"><div class="tag">Financial clarity</div><h2>Money, calmly</h2><p class="muted">Bills, redundancies, and opportunities to save will appear here once authorized financial sources are connected.</p><span class="pill">Not connected · no account access</span></section></div><section class="card"><div class="tag">Daily table</div><h2>Dinner inspiration</h2><p class="muted">Three flexible, quick ideas to start. Add your favorite recipes to your inspiration inbox.</p><div class="grid"><div class="quick"><strong>Lemon chicken bowls</strong><div class="small muted">25 min · chicken, rice, cucumbers, yogurt sauce</div></div><div class="quick"><strong>Sheet-pan salmon</strong><div class="small muted">25 min · salmon, potatoes, green vegetables</div></div><div class="quick"><strong>Bean & veggie quesadillas</strong><div class="small muted">15 min · beans, cheese, peppers, tortillas</div></div></div><p class="notice">These are starter ideas, not live Substack recommendations.</p></section></div>`)}function exportData(){const b=new Blob([JSON.stringify({version:1,exportedAt:stamp(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='everyday-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.gratitude)||!Array.isArray(d.ideas)||!Array.isArray(d.projects)||!Array.isArray(d.tasks))throw Error('Invalid backup');if(confirm('Replace the current local entries with this backup?')){state={...d,ritual:d.ritual||{}};save();render()}}catch{alert('That file is not a valid Atlas backup.')}};r.readAsText(f)}function settings(){return wrap('Make it yours.','Your words belong to you.',`<div class="stack"><section class="card"><h2>Privacy & storage</h2><p>Version 0.1 stores your reflections, ideas, projects, and tasks in this browser's local storage. There is no account, cloud sync, or automatic backup yet. Clearing browser data may erase your entries.</p><div class="actions"><button class="btn" onclick="exportData()">Export JSON backup ↓</button><label class="btn secondary" for="importFile" style="cursor:pointer">Import backup ↑</label><input type="file" id="importFile" accept="application/json,.json" onchange="importData(event)" hidden></div></section><section class="card"><h2>Next connections</h2><p class="muted">Planned: authenticated iPhone/Mac synchronization, Google and Apple calendar integration, approved news sources, creative app sharing, financial account aggregation, and recipe capture.</p><p class="small">No third-party services are currently connected. Do not enter banking passwords or sensitive financial details in notes.</p></section><section class="card"><h2>Start fresh</h2><p class="muted">Permanently clears this device's Atlas entries. Export a backup first if you want to keep them.</p><button class="btn ghost danger" onclick="if(confirm('Delete all local Atlas data? This cannot be undone.')){localStorage.removeItem(KEY);state={gratitude:[],ideas:[],projects:[],tasks:[],ritual:{}};render()}">Clear local data</button></section></div>`)}render();
</script></body></html>
